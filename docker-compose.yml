services:
  postgres:
    image: postgres:16-alpine
    container_name: tgads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgads_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tgads}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tgads}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tgads-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: tgads-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-facing values from .env with in-network service DNS names/ports.
      DATABASE_URL: postgresql://${POSTGRES_USER:-tgads}:${POSTGRES_PASSWORD:-tgads_dev_password}@postgres:5432/${POSTGRES_DB:-tgads}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
